<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light" />
    <title>AyudaYa: mapa y búsqueda de personas tras el sismo del Chocó</title>
    <meta
      name="description"
      content="Herramienta comunitaria para reportar necesidades (agua, comida, refugio, atención médica, vías bloqueadas) y buscar personas tras el sismo del Chocó. No es un canal oficial."
    />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icono.svg" />

    <!-- Conexión anticipada con los servidores de mapas: ahorra 200-400 ms en 3G -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />

    <!--
      CSS crítico en línea. Pinta el banner y el esqueleto en el primer viaje de
      red, antes de que llegue el CSS o el JS. En una conexión saturada esto es
      la diferencia entre "pantalla en blanco" y "la página ya cargó".
    -->
    <style>
      :root {
        --tinta: #0f172a;
        --papel: #f8fafc;
        --alerta: #b91c1c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--papel);
        color: var(--tinta);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.45;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior-y: none;
      }
      #raiz {
        min-height: 100dvh;
      }
      .arranque {
        padding: 0;
      }
      .arranque-banner {
        background: var(--alerta);
        color: #fff;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
      }
      .arranque-cuerpo {
        padding: 32px 20px;
        text-align: center;
        color: #475569;
      }
      .arranque-punto {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin: 0 3px;
        border-radius: 50%;
        background: #94a3b8;
        animation: latido 1.1s ease-in-out infinite;
      }
      .arranque-punto:nth-child(2) {
        animation-delay: 0.15s;
      }
      .arranque-punto:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes latido {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .arranque-punto {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="raiz">
      <!-- Sustituido por React en cuanto arranca. Si el JS falla o tarda,
           el usuario ve al menos el aviso y el número de emergencia. -->
      <div class="arranque">
        <div class="arranque-banner">
          Herramienta comunitaria, no oficial. En emergencia real llama al 123.
        </div>
        <div class="arranque-cuerpo">
          <p>
            <span class="arranque-punto"></span><span class="arranque-punto"></span
            ><span class="arranque-punto"></span>
          </p>
          <p>Cargando…</p>
          <noscript>
            <p>
              <strong>Esta página necesita JavaScript activado.</strong><br />
              Mientras tanto: emergencias <strong>123</strong> · Cruz Roja
              Colombiana <strong>132</strong> · Defensa Civil
              <strong>144</strong> · Bomberos <strong>119</strong>.
            </p>
          </noscript>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
